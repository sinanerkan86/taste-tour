<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taste Tour: City Music</title>
    <style>
      :root { --bg: #fbf6ee; --panel: #ffffff; --ink: #2b1d14; --muted: #7a6656; --line: #eadfce; --accent: #c0392b; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 'Segoe UI', system-ui, sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
      h1 { font-size: 24px; margin: 0 0 4px; }
      .sub { color: var(--muted); margin: 0 0 20px; }
      .songs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
      button.song { text-align: left; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
      button.song:hover { border-color: var(--accent); }
      button.song.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
      button.song b { display: block; font-size: 16px; }
      button.song span { color: var(--muted); font-size: 12px; }
      .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
      .bar button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
      #status { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>City music</h1>
      <p class="sub">Tap a city to play its loop (the tune comes in on the second time round). Tapping another city cross-fades like a franchise does.</p>
      <div class="bar"><button id="stop">Stop</button><span id="status">Stopped</span></div>
      <div class="songs" id="songs"></div>
    </main>
    <script type="module" src="/tools/music/page.ts"></script>
  </body>
</html>
