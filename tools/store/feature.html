<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1024, initial-scale=1" />
    <title>Feature graphic</title>
    <!-- The Play Store feature graphic (1024x500), rendered per language by feature.mjs.
         Preview: /tools/store/feature.html?lang=tr (the phone stays empty without a screenshot). -->
    <style>
      html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
      body {
        position: relative;
        font-family: 'Fredoka', system-ui, 'Microsoft YaHei', sans-serif;
        background:
          radial-gradient(circle at 24% 46%, rgba(255, 214, 120, 0.55), rgba(255, 214, 120, 0) 46%),
          repeating-conic-gradient(from 0deg at 24% 46%, #e2402f 0deg 9deg, #cf2f24 9deg 18deg),
          #d8342a;
      }
      .vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 40% 50%, rgba(0, 0, 0, 0) 55%, rgba(80, 10, 5, 0.45) 100%);
      }
      .icon {
        position: absolute; left: 14px; top: -8px; width: 360px; height: 360px;
        filter: drop-shadow(0 10px 14px rgba(70, 10, 0, 0.45));
      }
      .text { position: absolute; left: 70px; top: 300px; width: 560px; }
      h1 {
        margin: 0; font-size: 78px; line-height: 1; font-weight: 700; color: #fff;
        -webkit-text-stroke: 9px #7a1d12; paint-order: stroke fill;
        text-shadow: 0 6px 0 #7a1d12;
        letter-spacing: 1px;
      }
      .sub {
        display: inline-block; margin-top: 10px; padding: 6px 22px 8px; border-radius: 999px;
        background: linear-gradient(#ffe066, #ffb81c); color: #7a3a00;
        font-size: 34px; font-weight: 700; box-shadow: 0 5px 0 #a8590a, 0 8px 14px rgba(70, 10, 0, 0.35);
      }
      .tagline {
        position: absolute; left: 330px; top: 120px; width: 300px;
        color: #fff6e0; font-size: 40px; font-weight: 600; line-height: 1.12;
        text-shadow: 0 3px 0 rgba(110, 20, 10, 0.75);
      }
      .phone {
        position: absolute; left: 676px; top: 34px; width: 300px; height: 600px;
        border-radius: 42px; background: #1f1a24; padding: 12px; box-sizing: border-box;
        transform: rotate(6deg); box-shadow: 0 18px 40px rgba(60, 5, 0, 0.55), inset 0 0 0 3px #3b3344;
      }
      .screen { width: 100%; height: 100%; border-radius: 32px; overflow: hidden; background: #f3e3c6; }
      .screen img { width: 100%; display: block; }
    </style>
  </head>
  <body>
    <div class="vignette"></div>
    <img class="icon" src="/assets/icon-foreground.png" alt="" />
    <div class="tagline" id="tagline"></div>
    <div class="text">
      <h1>Taste Tour</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="phone"><div class="screen"><img id="shot" alt="" /></div></div>
    <script type="module">
      import '@fontsource/fredoka/600.css';
      import '@fontsource/fredoka/700.css';

      const TEXTS = {
        en: { sub: 'Idle Restaurant', tagline: 'Cook your way around the world' },
        tr: { sub: 'Restoran Oyunu', tagline: 'Mutfağınla dünyayı dolaş' },
        fr: { sub: 'Restaurant Idle', tagline: 'Le tour du monde en cuisine' },
        zh: { sub: '放置餐厅', tagline: '用美食环游世界' },
      };
      const lang = new URLSearchParams(location.search).get('lang') ?? 'en';
      const text = TEXTS[lang] ?? TEXTS.en;
      document.documentElement.lang = lang;
      document.getElementById('sub').textContent = text.sub;
      document.getElementById('tagline').textContent = text.tagline;

      // feature.mjs hands in a screenshot as a data URL, then waits for window.ready.
      window.setShot = (url) =>
        new Promise((resolve) => {
          const img = document.getElementById('shot');
          img.onload = resolve;
          img.src = url;
        });
      document.fonts.ready.then(() => (window.ready = true));
    </script>
  </body>
</html>
